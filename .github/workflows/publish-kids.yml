name: AETHER publish - kids

# No cron yet - manual dispatch only until the Kids Google Cloud project
# (under claudekidsyt@gmail.com) exists and YOUTUBE_CLIENT_SECRET_KIDS_JSON /
# YOUTUBE_TOKEN_KIDS_JSON secrets are both set. Once both exist, add a
# schedule: block here like publish-mystery.yml has.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore YouTube credentials
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret_kids.json
          printf '%s' "$TOKEN_JSON" > token_kids.json
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_KIDS_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_KIDS_JSON }}

      - name: Run AETHER publish
        run: python auto_publish.py kids

      - name: Persist used-topics log
        run: |
          git config user.name "AETHER bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/used_topics_kids.json
          git diff --cached --quiet || git commit -m "chore: update used topics (kids)"
          git push

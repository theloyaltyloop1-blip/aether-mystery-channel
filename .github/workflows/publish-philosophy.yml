name: AETHER publish - philosophy

# 3x/day ("3 parts a day"), offset from the mystery channel's cron times
# (23/5/11/17 UTC) so the two channels don't both grab a runner at once.
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-llama3.2-3b

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Restore YouTube credentials
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret_philosophy.json
          printf '%s' "$TOKEN_JSON" > token_philosophy.json
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_PHILOSOPHY_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_PHILOSOPHY_JSON }}

      - name: Run AETHER publish
        run: python auto_publish.py philosophy

      - name: Persist used-topics log
        run: |
          git config user.name "AETHER bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/used_topics_philosophy.json
          git diff --cached --quiet || git commit -m "chore: update used topics (philosophy)"
          git push
